# ---------- INPUT ----------
# Receives logs from Docker's `fluentd` logging driver (forward protocol)
<source>
  @type forward
  bind 0.0.0.0
  port 24224
</source>

# ---------- FILTERS ----------
# The Docker driver wraps each line as {"log": "<raw line>", container_id, container_name, source}.
# Our app prints JSON, so parse the `log` field and merge its keys into the record.
<filter docker.**>
  @type parser
  key_name log
  reserve_data true                    # keep container_id, container_name, ...
  remove_key_name_field true           # drop raw `log` once parsed
  emit_invalid_record_to_error false   # non-JSON lines are kept as-is instead of dropped
  <parse>
    @type json
  </parse>
</filter>

# Add a static field to every event
<filter docker.**>
  @type record_transformer
  <record>
    fluentd_host "#{Socket.gethostname}"
  </record>
</filter>

# ---------- OUTPUT ----------
<match docker.**>
  @type elasticsearch
  host "#{ENV['ES_HOST'] || 'elasticsearch'}"
  port "#{ENV['ES_PORT'] || '9200'}"
  scheme http

  # Daily indices: app-logs-YYYY.MM.DD
  logstash_format true
  logstash_prefix "#{ENV['ES_INDEX_PREFIX'] || 'app-logs'}"
  logstash_dateformat %Y.%m.%d

  # Elasticsearch 8 compatibility
  default_elasticsearch_version 8
  verify_es_version_at_startup false
  suppress_type_name true

  include_tag_key true
  tag_key fluentd_tag

  reconnect_on_error true
  reload_on_failure true
  request_timeout 15s

  <buffer>
    @type file
    path /fluentd/log/buffer
    flush_mode interval
    flush_interval 5s
    flush_thread_count 2
    retry_type exponential_backoff
    retry_wait 1s
    retry_max_interval 30s
    retry_forever true
    chunk_limit_size 8MB
    overflow_action block
  </buffer>
</match>

# Also print events to Fluentd's own stdout so `docker compose logs fluentd` shows what flows through
# (remove this block once you're happy; it is noisy)
<match **>
  @type stdout
</match>
